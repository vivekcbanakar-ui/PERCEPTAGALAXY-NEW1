<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a" />
      <stop offset="50%" style="stop-color:#581c87" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa" />
      <stop offset="100%" style="stop-color:#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative stars -->
  <g fill="white" opacity="0.3">
    <circle cx="100" cy="80" r="2" />
    <circle cx="250" cy="150" r="1.5" />
    <circle cx="400" cy="100" r="2.5" />
    <circle cx="600" cy="60" r="1.5" />
    <circle cx="850" cy="120" r="2" />
    <circle cx="1050" cy="80" r="1.5" />
    <circle cx="150" cy="500" r="2" />
    <circle cx="350" cy="550" r="1.5" />
    <circle cx="550" cy="520" r="2" />
    <circle cx="900" cy="540" r="1.5" />
    <circle cx="1100" cy="500" r="2" />
  </g>

  <!-- Logo + Brand -->
  <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="80" font-weight="900" fill="white" text-anchor="middle">✨ Percepta Galaxy</text>

  <!-- Main headline -->
  <text x="600" y="320" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" fill="url(#text)" text-anchor="middle">Know Your Competitors</text>
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">Before They Move</text>

  <!-- Subheadline -->
  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#cbd5e1" text-anchor="middle">AI-powered competitive intelligence for founders</text>

  <!-- CTA -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700" fill="#9333ea" text-anchor="middle">$399/month • No contracts • 14-day free trial</text>
</svg>
